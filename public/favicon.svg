<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Vault Background Gradient -->
    <radialGradient id="vaultBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="70%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Vault-Tec Vintage Industrial Gold Gradient -->
    <linearGradient id="vaultGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="30%" stop-color="#FFD100" />
      <stop offset="70%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Inner Steel Cobalt Rim Gradient -->
    <linearGradient id="vaultCobalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#0033A0" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Pip-Boy Phosphor Accent -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#15FF0E" flood-opacity="0.35" />
    </filter>

    <!-- Heavy Drop Shadow for Gear -->
    <filter id="gearShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- 1. Внешний круг / контрастная подложка для светлых и темных вкладок браузера -->
  <circle cx="256" cy="256" r="250" fill="url(#vaultBg)" stroke="#FFD100" stroke-width="6" />

  <!-- 2. Шестеренка Убежища (Vault Blast Door Cog - 12 массивных зубьев) -->
  <g filter="url(#gearShadow)" fill="url(#vaultGold)">
    <!-- Внешнее тело шестерни -->
    <circle cx="256" cy="256" r="202" />

    <!-- 12 зубьев шестеренки (угол шага 30 градусов) -->
    <rect x="237" y="16" width="38" height="52" rx="4" />
    <rect x="237" y="16" width="38" height="52" rx="4" transform="rotate(30 256 256)" />
    <rect x="237" y="16" width="38" height="52" rx="4" transform="rotate(60 256 256)" />
    <rect x="237" y="16" width="38" height="52" rx="4" transform="rotate(90 256 256)" />
    <rect x="237" y="16" width="38" height="52" rx="4" transform="rotate(120 256 256)" />
    <rect x="237" y="16" width="38" height="52" rx="4" transform="rotate(150 256 256)" />
    <rect x="237" y="16" width="38" height="52" rx="4" transform="rotate(180 256 256)" />
    <rect x="237" y="16" width="38" height="52" rx="4" transform="rotate(210 256 256)" />
    <rect x="237" y="16" width="38" height="52" rx="4" transform="rotate(240 256 256)" />
    <rect x="237" y="16" width="38" height="52" rx="4" transform="rotate(270 256 256)" />
    <rect x="237" y="16" width="38" height="52" rx="4" transform="rotate(300 256 256)" />
    <rect x="237" y="16" width="38" height="52" rx="4" transform="rotate(330 256 256)" />
  </g>

  <!-- 3. Внутренний обод двери со шлюзовыми заклепками (Vault Door Ring) -->
  <circle cx="256" cy="256" r="172" fill="url(#vaultCobalt)" stroke="#0D1117" stroke-width="6" />

  <!-- 12 индустриальных заклепок/болтов по периметру -->
  <g fill="#FFD100" stroke="#000000" stroke-width="2">
    <circle cx="256" cy="98" r="6" />
    <circle cx="256" cy="98" r="6" transform="rotate(30 256 256)" />
    <circle cx="256" cy="98" r="6" transform="rotate(60 256 256)" />
    <circle cx="256" cy="98" r="6" transform="rotate(90 256 256)" />
    <circle cx="256" cy="98" r="6" transform="rotate(120 256 256)" />
    <circle cx="256" cy="98" r="6" transform="rotate(150 256 256)" />
    <circle cx="256" cy="98" r="6" transform="rotate(180 256 256)" />
    <circle cx="256" cy="98" r="6" transform="rotate(210 256 256)" />
    <circle cx="256" cy="98" r="6" transform="rotate(240 256 256)" />
    <circle cx="256" cy="98" r="6" transform="rotate(270 256 256)" />
    <circle cx="256" cy="98" r="6" transform="rotate(300 256 256)" />
    <circle cx="256" cy="98" r="6" transform="rotate(330 256 256)" />
  </g>

  <!-- 4. Центральный стальной диск (Гермолюк) -->
  <circle cx="256" cy="256" r="142" fill="#0A0E17" stroke="#FFD100" stroke-width="8" />
  
  <!-- Тонкое зеленое фосфорное кольцо Pip-Boy внутри -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="#15FF0E" stroke-width="3" stroke-dasharray="14 6" opacity="0.85" />

  <!-- 5. Легендарные жирные ретро-цифры "67" Убежища (Vault 67) -->
  <g filter="url(#subtleGlow)">
    <!-- Тень текста для четкости на 16x16 px -->
    <text
      x="256"
      y="312"
      font-family="system-ui, -apple-system, 'Impact', 'Oswald', 'Arial Black', sans-serif"
      font-size="168"
      font-weight="900"
      letter-spacing="-6"
      text-anchor="middle"
      fill="#000000"
      stroke="#000000"
      stroke-width="12"
      stroke-linejoin="round"
    >67</text>

    <!-- Основные золотые цифры 67 -->
    <text
      x="256"
      y="312"
      font-family="system-ui, -apple-system, 'Impact', 'Oswald', 'Arial Black', sans-serif"
      font-size="168"
      font-weight="900"
      letter-spacing="-6"
      text-anchor="middle"
      fill="url(#vaultGold)"
      stroke="#FFD100"
      stroke-width="2"
    >67</text>
  </g>

  <!-- Верхняя и нижняя ретро-маркировка VAULT // TEC -->
  <text
    x="256"
    y="168"
    font-family="system-ui, -apple-system, 'Roboto Mono', monospace"
    font-size="20"
    font-weight="800"
    letter-spacing="5"
    text-anchor="middle"
    fill="#15FF0E"
    opacity="0.9"
  >VAULT</text>

  <text
    x="256"
    y="355"
    font-family="system-ui, -apple-system, 'Roboto Mono', monospace"
    font-size="17"
    font-weight="700"
    letter-spacing="4"
    text-anchor="middle"
    fill="#93C5FD"
    opacity="0.8"
  >SEC-67</text>
</svg>
